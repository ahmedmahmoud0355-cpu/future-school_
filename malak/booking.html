<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future School - Activities</title>
    <link rel="icon" href="assets/favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar container">
            <h2 class="logo">Future School</h2>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="blog.html">News</a></li>
                <li><a class="active" href="booking.html">Activities</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container section">
        <div class="page-heading">
            <h1>Join Our Activities</h1>
            <p>Fill in the form to register for a school activity.</p>
        </div>

        <form class="form-box">
            <div class="form-grid">
                <div class="form-group">
                    <label for="student-name">Student Name</label>
                    <input id="student-name" type="text" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="student-email">Email</label>
                    <input id="student-email" type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="activity">Choose Activity</label>
                    <select id="activity" required>
                        <option value="">Select an activity</option>
                        <option>Technology Club</option>
                        <option>Science Lab</option>
                        <option>Arts &amp; Design</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Preferred Date</label>
                    <input id="date" type="date" required>
                </div>
                <div class="form-group full-width">
                    <label for="notes">Notes</label>
                    <textarea id="notes" rows="4" placeholder="Write your notes here"></textarea>
                </div>
                <div class="form-group full-width">
                    <label><input type="checkbox" required> I agree to join this activity.</label>
                </div>
                <button class="button full-width" type="submit">Send Registration</button>
            </div>
            <p class="small-note">This is a demo form. It does not send or save information.</p>
        </form>
    </main>

    <footer><p>Future School - Learning for a better future</p></footer>
</body>
</html>
